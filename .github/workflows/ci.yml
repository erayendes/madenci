# The one workflow every project starts with. Its real value here is the pinning
# convention: every action is a full commit SHA with its release tag in a trailing
# comment. A moving tag (@v4) can be repointed at malicious code by whoever owns the
# action; a SHA cannot. Dependabot reads the comment and bumps both together, so the
# lock costs nothing to maintain — see .github/dependabot.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # This name is the required status check a branch ruleset asks for.
    # Rename it and you must update the ruleset too (scripts/harden-public-repo.sh).
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Hook tests
        run: node --test test/hook.test.js

      - name: SKILL.md frontmatter is intact
        run: |
          head -1 skills/madenci/SKILL.md | grep -qx -- '---'
          grep -q '^name: madenci' skills/madenci/SKILL.md
          grep -q 'madenci:core' skills/madenci/SKILL.md

      - name: Install into a sandbox home, verify, uninstall
        run: |
          node bin/madenci.js install --dry-run --all
          export HOME="$RUNNER_TEMP/sandbox-home"
          mkdir -p "$HOME"
          node bin/madenci.js install --only claude,codex
          test -f "$HOME/.claude/skills/madenci/SKILL.md"
          test -f "$HOME/.claude/skills/madenci/references/audit.md"
          test -f "$HOME/.codex/skills/madenci/SKILL.md"
          node bin/madenci.js uninstall
          test ! -e "$HOME/.claude/skills/madenci"
